# RummiHub sur un seul VPS. Lancer depuis ce dossier : docker compose up -d --build
# Seul Caddy publie 80 et 443. L'API, Redis et les workers restent sur le réseau internal.

name: rummihub

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  ConnectionStrings__cache: cache:6379,abortConnect=false
  # Traces, métriques et journaux structurés vers le tableau de bord (OTLP gRPC).
  # Vide ou absent : ServiceDefaults n'exporte rien.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  # Clé sans laquelle le tableau de bord refuse la télémétrie (Dashboard__Otlp).
  OTEL_EXPORTER_OTLP_HEADERS: x-otlp-api-key=${OTLP_API_KEY:?Définir OTLP_API_KEY dans deploy/.env}

services:
  caddy:
    # Version épinglée : une mise à jour est un commit visible (Dependabot la propose).
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Tourne en root (image officielle) : on ne lui laisse que l'ouverture des ports
    # 80/443, et aucun gain de privilèges (setuid, capacités de fichier).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *logging
    depends_on:
      webfrontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Définir DOMAIN dans deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Définir ACME_EMAIL dans deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - internal
      # Réseau partagé avec le webfrontend du site de test (alias webfrontend-test).
      # Externe et interne : pas de passerelle, donc la pile de test ne peut pas
      # sortir vers Internet ni joindre les autres réseaux par là. Si le conteneur
      # de test est absent, le nom ne résout pas et Caddy répond 502 sur ce seul site.
      - rummihub-edge
    deploy:
      resources:
        limits:
          memory: 128M

  webfrontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: RummiHub.Web/RummiHub.Web.csproj
        ASSEMBLY: RummiHub.Web.dll
    image: rummihub-webfrontend:local
    restart: unless-stopped
    logging: *logging
    # Une seule réplique : parties et secrets de siège sont en mémoire.
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: webfrontend
      SolverApi__Key: ${SOLVER_API_KEY:?Définir SOLVER_API_KEY dans deploy/.env}
      ApiService__BaseAddress: http://apiservice:8080
      services__apiservice__http__0: http://apiservice:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DataProtection__KeysPath: /var/rummihub/keys
      # Catalogue de graines : ce processus est le seul à écrire le fichier.
      # Le site de test appelle l'alias seed-catalog, il ne monte pas le volume.
      SeedCatalog__Mode: File
      SeedCatalog__Path: /var/rummihub/seeds/catalog.jsonl
      SeedCatalog__ApiKey: ${SEED_CATALOG_KEY:?Définir SEED_CATALOG_KEY dans deploy/.env}
    volumes:
      - dataprotection_keys:/var/rummihub/keys
      - seed_catalog:/var/rummihub/seeds
    # internal : le réseau applicatif. rummihub-edge : uniquement pour que le
    # webfrontend de test joigne l'alias seed-catalog. Ne pas résoudre le nom
    # « webfrontend » sur rummihub-edge : la pile de test y a le même nom de
    # service. Caddy vise rummihub-webfrontend-1 et l'alias webfrontend-test.
    networks:
      internal: {}
      rummihub-edge:
        aliases:
          - seed-catalog
    depends_on:
      cache:
        condition: service_healthy
      apiservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health | grep -qx 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 1280M

  apiservice:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: RummiHub.ApiService/RummiHub.ApiService.csproj
        ASSEMBLY: RummiHub.ApiService.dll
    image: rummihub-apiservice:local
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: apiservice
      SolverApi__Key: ${SOLVER_API_KEY:?Définir SOLVER_API_KEY dans deploy/.env}
    networks:
      - internal
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health | grep -qx 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  solver-worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PROJECT: RummiHub.Solver.Worker/RummiHub.Solver.Worker.csproj
        ASSEMBLY: RummiHub.Solver.Worker.dll
    image: rummihub-solver-worker:local
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: solver-worker
    networks:
      - internal
    depends_on:
      cache:
        condition: service_healthy
    stop_grace_period: 30s
    # Même nombre que AppHost : WithReplicas(2). Le groupe Redis « solvers » se partage le travail.
    # 1,5 CPU chacun : sur un VPS 4 vCPU, le repli GraphSolver (BFS parallèle) ne peut pas
    # prendre tous les cœurs et laisse au moins un CPU à webfrontend, apiservice, Redis et Caddy.
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  cache:
    image: redis:8.10.2
    restart: unless-stopped
    logging: *logging
    # Redis 8.10 embarque les anciens modules Stack (RedisJSON, Search, TimeSeries,
    # Bloom). docker-entrypoint.sh ajoute --loadmodule pour chaque .so de
    # /usr/local/lib/redis/modules : ne pas les relister ici (double chargement).
    # redis-stack-server lisait REDIS_ARGS ; cette image l'ignore.
    # L'AOF reste dans /data (WORKDIR). Stack tournait en root et a pu semer
    # /data/redis et /data/redisinsight : l'entrypoint officiel ne chown alors
    # pas le volume, et Redis 8 charge l'AOF puis échoue à le rouvrir en écriture.
    # On rend /data à l'utilisateur redis avant de lancer l'entrypoint. Pas de
    # port publié, pas de mot de passe. REDIS_MAXMEMORY est lu par ce shell
    # ($$ pour échapper Compose) ; le site de test le baisse.
    entrypoint: ["/bin/sh", "-c"]
    environment:
      REDIS_MAXMEMORY: 512mb
    command:
      - |
        set -eu
        chown -R redis:redis /data
        exec docker-entrypoint.sh redis-server \
          --appendonly yes \
          --maxmemory "$$REDIS_MAXMEMORY" \
          --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 768M

  # Tableau de bord Aspire : traces, métriques et journaux structurés des trois
  # services .NET. Tout reste en mémoire et disparaît à chaque redémarrage.
  # Interface sur 127.0.0.1 seulement, à ouvrir par tunnel SSH (deploy/README.md,
  # « Traces et métriques »). Le port OTLP n'est joignable que depuis internal
  # et n'accepte que les envois qui portent OTLP_API_KEY.
  # Aucun service n'en dépend : arrêté ou absent, l'export échoue en silence.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    restart: unless-stopped
    logging: *logging
    # Interface : connexion par jeton, tiré au démarrage et écrit dans le journal du
    # conteneur. Garde par défaut les 10 000 dernières traces et entrées de journal
    # par service.
    environment:
      # Réception OTLP (gRPC 18889, HTTP 18890) : en-tête x-otlp-api-key exigé, posé
      # par x-dotnet-env. Clé vide : le tableau de bord ne démarre pas, d'où le :?.
      Dashboard__Otlp__AuthMode: ApiKey
      Dashboard__Otlp__PrimaryApiKey: ${OTLP_API_KEY:?Définir OTLP_API_KEY dans deploy/.env}
      # API /api/telemetry (en-tête x-api-key), pour lire la télémétrie depuis le VPS.
      # Clé vide ou absente : l'API répond 401 à tout, l'interface reste accessible.
      # Facultative pour que .env.test n'ait pas à la définir.
      Dashboard__Api__AuthMode: ApiKey
      Dashboard__Api__PrimaryApiKey: ${DASHBOARD_API_KEY:-}
    ports:
      - "127.0.0.1:18888:18888"
    networks:
      - internal
      # internal n'a pas de passerelle : sans ce réseau, Docker ne publie pas le port.
      - dashboard
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  edge:
  internal:
    internal: true
  dashboard:
  # Créé une fois sur l'hôte : docker network create --internal rummihub-edge
  # (rummihub-ensure-edge-network le fait aussi). Externe pour qu'un
  # `docker compose down` de l'un ou l'autre projet ne le supprime pas.
  rummihub-edge:
    external: true
    name: rummihub-edge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  dataprotection_keys:
  # JSONL des graines proposées. Jamais monté par la pile de test.
  # Ne pas le supprimer : un `docker compose down` sans -v le garde.
  seed_catalog:
