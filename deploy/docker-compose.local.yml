# Essai sur la machine, sans DNS public ni Let's Encrypt.
# rummisolve.localhost et www.rummisolve.localhost pointent vers 127.0.0.1.
#
#   cd deploy
#   cp .env.example .env   # remplir SOLVER_API_KEY et OTLP_API_KEY ; DOMAIN et ACME_EMAIL peuvent rester
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Le certificat est interne à Caddy. Un navigateur affiche un avertissement ;
# curl -k ou un client qui ignore l'erreur TLS passent.

services:
  # Pas de pile de test sur la machine : le webfrontend reste sur internal.
  webfrontend:
    networks: !override
      - internal

  caddy:
    environment:
      DOMAIN: rummisolve.localhost
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_local_data:/data
      - caddy_local_config:/config
    # Pas de réseau partagé avec un site de test sur la machine de dev.
    # Caddyfile.local ne route pas test.*.
    networks: !override
      - edge
      - internal

networks:
  rummihub-edge: !reset null

volumes:
  caddy_local_data:
  caddy_local_config:
