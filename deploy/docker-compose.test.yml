# Site de test (https://test.rummisolve.com). À n'utiliser que sur le clone
# /home/ubuntu/apps/RummiHub-test, jamais dans le dépôt de production.
#
# Pas de Caddy et aucun port publié : le Caddy de production joint le réseau
# externe rummihub-edge et proxifie l'alias webfrontend-test. Les images sont
# taguées :test pour ne pas écraser les tags :local de la production.
#
#   docker compose -p rummihub-test --env-file .env.test \
#     -f docker-compose.yml -f docker-compose.test.yml up -d --build
#
# Le fichier .env.test (voir .env.test.example) n'est pas versionné.

name: rummihub-test

services:
  # Le profil empêche le démarrage. Ports vidés en plus : même avec
  # --profile prod-only, ce Caddy ne peut pas prendre 80/443 à la production.
  caddy:
    profiles: ["prod-only"]
    ports: !override []
    restart: "no"

  # Pas de tableau de bord sur le site de test : le port 18888 de l'hôte est déjà
  # pris par celui de la production. Les services n'exportent rien (endpoint vide).
  aspire-dashboard:
    profiles: ["prod-only"]
    ports: !override []
    restart: "no"

  webfrontend:
    image: rummihub-webfrontend:test
    # Bandeau « Site de test · branche · commit » en bas à gauche (MainLayout).
    # TEST_COMMIT est posé par rummihub-deploy-test-run ; vide, pas de bandeau.
    environment:
      TestSite__Commit: ${TEST_COMMIT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    mem_limit: 512M
    memswap_limit: 512M
    networks:
      internal: {}
      rummihub-edge:
        aliases:
          - webfrontend-test
    deploy:
      resources:
        limits:
          memory: 512M

  apiservice:
    image: rummihub-apiservice:test
    mem_limit: 256M
    memswap_limit: 256M
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    deploy:
      resources:
        limits:
          memory: 256M

  solver-worker:
    image: rummihub-solver-worker:test
    mem_limit: 1024M
    memswap_limit: 1024M
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    # 1 réplique, 1 CPU, et moins de poids CPU que la prod (cpu_shares 1024
    # par défaut) : sous charge, les workers de prod passent devant.
    cpu_shares: 512
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  cache:
    mem_limit: 320M
    memswap_limit: 320M
    environment:
      REDIS_ARGS: --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 320M

networks:
  rummihub-edge:
    external: true
    name: rummihub-edge
