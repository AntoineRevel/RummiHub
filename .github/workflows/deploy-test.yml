# Déploiement manuel du site de test (https://test.rummisolve.com).
# La branche est celle choisie dans « Use workflow from » (github.ref_name).
# Ce fichier doit être sur cette branche : toute branche créée depuis master
# après la PR #39. Une étiquette (github.ref_type != branch) est refusée.
# Les tests tournent ici : ce workflow n'est pas exigé par la protection de master.
# SSH réutilise la clé de production. La commande forcée n'accepte que
# « deploy-test <branche> » (deploy/autodeploy/rummihub-deploy). Le VPS
# revalide le nom (rummihub-branch-ok) avant tout git.
name: Déploiement du site de test

on:
  workflow_dispatch:

permissions:
  contents: read

# Un déploiement de test à la fois ; celui en cours n'est jamais annulé.
concurrency:
  group: test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vérifier que la ref est une branche
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" != "branch" ]; then
            echo "Refus : dans « Use workflow from », choisir une branche, pas une étiquette (reçu : ${REF_TYPE}, « ${REF_NAME} »)." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RummiHub.slnx

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Déployer la branche sur le site de test
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" != "branch" ]; then
            echo "Refus : dans « Use workflow from », choisir une branche, pas une étiquette (reçu : ${REF_TYPE}, « ${BRANCH} »)." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "ubuntu@${SSH_HOST}" "deploy-test ${BRANCH}"
