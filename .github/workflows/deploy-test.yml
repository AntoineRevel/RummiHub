# Déploiement manuel du site de test (https://test.rummisolve.com).
# Lancer depuis la branche master (c'est ce fichier-ci qui s'exécute) et indiquer
# dans « branch » la branche à construire. Les tests tournent ici : ce workflow
# n'est pas exigé par la protection de master.
# SSH réutilise la clé de production. La commande forcée n'accepte que
# « deploy-test <branche> » (deploy/autodeploy/rummihub-deploy). Installer les
# scripts sur le VPS avant le premier lancement : sinon l'ancien script ignore
# la commande et redéploie la production.
name: Déploiement du site de test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branche à déployer (doit exister sur origin)
        required: true
        default: master
        type: string

permissions:
  contents: read

# Un déploiement de test à la fois ; celui en cours n'est jamais annulé.
concurrency:
  group: test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Valider le nom de branche
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -eu
          # Mêmes règles que deploy/autodeploy/rummihub-branch-ok.
          if [ -z "$BRANCH" ] || [ "${#BRANCH}" -gt 100 ]; then
            echo "Branche refusée." >&2
            exit 1
          fi
          case "$BRANCH" in
            -*|*..*|*[!A-Za-z0-9._/-]*)
              echo "Branche refusée." >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RummiHub.slnx

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Déployer la branche sur le site de test
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -eu
          if [ -z "$BRANCH" ] || [ "${#BRANCH}" -gt 100 ]; then
            echo "Branche refusée." >&2
            exit 1
          fi
          case "$BRANCH" in
            -*|*..*|*[!A-Za-z0-9._/-]*)
              echo "Branche refusée." >&2
              exit 1
              ;;
          esac
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "ubuntu@${SSH_HOST}" "deploy-test ${BRANCH}"
