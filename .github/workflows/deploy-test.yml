# Déploiement du site de test (https://test.rummisolve.com) à chaque push sur la
# branche test. Pour y mettre une branche : git push --force origin <branche>:test
# Les tests tournent ici : ce workflow n'est pas exigé par la protection de master.
# SSH réutilise la clé de production. La commande forcée n'accepte que
# « deploy-test », sans argument : le VPS déploie origin/test, et refuse une
# branche test qui modifie deploy/ (deploy/autodeploy/rummihub-deploy-test-run).
name: Déploiement du site de test

on:
  push:
    branches: [test]

permissions:
  contents: read

# Un déploiement de test à la fois ; celui en cours n'est jamais annulé.
concurrency:
  group: test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RummiHub.slnx

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Déployer origin/test sur le site de test
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$SSH_HOST" deploy-test
