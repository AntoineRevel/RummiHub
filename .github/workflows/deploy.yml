# Tests sur chaque PR : le check requis « test » (branche à jour) est imposé
# par la protection de master, donc le déploiement ne les relance pas.
# Sur master (push ou lancement manuel) : déploiement direct sur le VPS.
# Le job deploy se connecte en SSH sans commande distante. La clé ne peut exécuter
# que rummihub-deploy : sans commande, cela déploie origin/master. « deploy-test »
# est réservé au site de test (deploy/README.md).
name: Tests et déploiement

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test RummiHub.slnx

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Un déploiement à la fois ; celui en cours n'est jamais annulé.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Déployer sur le VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$SSH_HOST"
