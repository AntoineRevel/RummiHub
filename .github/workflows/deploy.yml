# Déploiement de la production, sur master (push ou lancement manuel). Les tests ont
# tourné sur la PR (pr.yml) : le check requis « test » et la branche à jour sont
# imposés par la protection de master, donc ils ne sont pas relancés ici.
# Le job se connecte en SSH sans commande distante. La clé ne peut exécuter que
# rummihub-deploy : sans commande, cela déploie origin/master. « deploy-test » est
# réservé au site de test (deploy/README.md).
name: Déploiement de production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Un déploiement à la fois ; celui en cours n'est jamais annulé.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Déployer sur le VPS
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$SSH_HOST"
